[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "myvllm"
version = "0.1.0.dev0"
description = "A text inference engine for Qwen3.8-27B"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
model = ["torch>=2.6", "transformers>=5.8,<6", "safetensors>=0.5"]

[tool.setuptools]
packages = ["myvllm"]
